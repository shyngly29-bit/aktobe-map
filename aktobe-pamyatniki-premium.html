<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ақтөбе ескерткіштері</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: city map in the spirit of 2GIS. Desktop: search + panel on the left, map on the right. Phone: full-screen map, search on top, bottom sheet. */
:root{
  --land:#EEEEEA; --block:#F4F3EF; --road:#FFFFFF; --case:#D9D6CE; --main:#FFE7A8; --main-case:#E9C374; --park:#CFE8B8; --water:#AAD3EE; --rail:#B9B5AC;
  --ink:#1F2328; --ink-2:#5F6670; --ink-3:#8A9099; --label:#3D434A; --halo:#FFFFFF;
  --panel:#FFFFFF; --panel-2:#F5F6F7; --line:#E4E6E9;
  --accent:#1BA136; --accent-soft:rgba(27,161,54,.13); --on-accent:#FFFFFF;
  --c-mon:#C2582D; --c-mem:#4F6B7A; --c-rel:#7350B0; --c-mus:#1C7F8C;
  --shadow:0 4px 18px rgba(20,25,30,.14),0 1px 3px rgba(20,25,30,.10);
  --f:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
}
html,body{height:100%}
body{background:var(--land);color:var(--ink);font-family:var(--f);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:400px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}

/* top bar */
.top{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:10px;padding:14px 16px 10px;background:var(--panel);border-right:1px solid var(--line);position:relative;z-index:20}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand b{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand b i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand b i svg{width:15px;height:15px}
.lang{display:inline-flex;background:var(--panel-2);border-radius:999px;padding:3px;flex:none}
.lang button{border:none;background:transparent;color:var(--ink-2);font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;min-height:32px}
.lang button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sbox{position:relative;flex:1;min-width:0}
.sbox svg{position:absolute;left:12px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search{width:100%;padding:11px 36px 11px 38px;border:none;border-radius:12px;background:var(--panel-2);font-size:14.5px;min-height:44px}
.search::placeholder{color:var(--ink-3)}
.sclear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;background:transparent;color:var(--ink-3);font-size:18px;cursor:pointer;border-radius:50%}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;max-height:60vh;overflow-y:auto;z-index:30}
.results[hidden]{display:none}
.res{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;border:none;background:transparent;padding:9px 14px;cursor:pointer;min-height:48px}
.res:hover,.res.kb{background:var(--panel-2)}
.res .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}
.res .ic svg{width:15px;height:15px}
.res b{display:block;font-weight:500;font-size:14px;line-height:1.3}
.res span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.3}
.res mark{background:none;color:var(--accent);font-weight:600}
.res-empty{padding:14px;color:var(--ink-2);font-size:13.5px}

/* side panel */
.side{grid-column:1;grid-row:2;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line);z-index:10}
.grip{display:none}
.pane{overflow:auto;flex:1;min-height:0;overscroll-behavior:contain}
.tabs{display:flex;gap:4px;padding:4px 16px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tab{border:none;background:transparent;padding:10px 10px 11px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;min-height:44px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.walkbtn{display:flex;align-items:center;gap:12px;margin:14px 16px 6px;padding:14px 16px;border-radius:14px;border:none;background:var(--accent);color:var(--on-accent);width:calc(100% - 32px);text-align:left;cursor:pointer;min-height:56px}
.walkbtn svg{width:22px;height:22px;flex:none}
.walkbtn b{display:block;font-size:15px}
.walkbtn span{display:block;font-size:12.5px;opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;cursor:pointer;min-height:36px}
.chip i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff}
.chip i svg{width:11px;height:11px}
.chip small{color:var(--ink-3)}
.chip[aria-pressed="false"]{opacity:.5}
.h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0;padding:16px 16px 6px}
.list{list-style:none;margin:0;padding:0 8px 8px}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:none;background:transparent;padding:9px 10px;border-radius:12px;cursor:pointer;min-height:54px}
.row:hover,.row.hl{background:var(--panel-2)}
.row.on{background:var(--accent-soft)}
.row .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}
.row .ic svg{width:17px;height:17px}
.row .ic.st{background:var(--panel-2);color:var(--ink-2)}
.row .ic img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.row b{display:block;font-weight:500;font-size:14px;line-height:1.3}
.row span{display:block;color:var(--ink-2);font-size:12.5px;line-height:1.35}
.tag3d{font-size:10.5px;font-weight:700;color:var(--accent);border:1.5px solid currentColor;border-radius:6px;padding:0 5px}
.hp{width:18px;height:18px;color:var(--ink-3)}
.route{margin:8px 16px 8px;padding:14px;border-radius:14px;background:var(--panel-2)}
.route b{font-size:14.5px}
.route p{margin:2px 0 10px;color:var(--ink-2);font-size:13px}
.stops{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.stops button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 10px 5px 5px;font-size:13px;cursor:pointer;min-height:36px}
.stops button i{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-style:normal;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.tours{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 8px}
.tcard{display:flex;flex-direction:column;padding:11px 12px;border-radius:12px;background:var(--panel-2);text-decoration:none;color:var(--ink);min-width:0;min-height:44px}
.tcard em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.tcard b{font-weight:500;font-size:13px;line-height:1.3}
.note{padding:12px 16px 24px;color:var(--ink-3);font-size:12px;margin:0}
.note a{color:inherit}
.empty{padding:6px 16px 14px;color:var(--ink-2)}

/* cards (inside the panel) */
.card{padding:0 0 20px}
.cbar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px 8px;position:sticky;top:0;background:var(--panel);z-index:2}
.back,.x{border:none;background:transparent;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink-2);min-height:40px;font-weight:500}
.back:hover,.x:hover{background:var(--panel-2);color:var(--ink)}
.x{width:40px;justify-content:center;font-size:20px}
.cphoto{margin:0 16px;border-radius:14px;overflow:hidden;background:var(--panel-2)}
.cphoto img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;max-width:100%}
.credit{font-size:11px;color:var(--ink-3);padding:5px 16px 0;margin:0}
.credit a{color:inherit}
.cin{padding:12px 16px 0;display:flex;flex-direction:column;gap:14px}
.ccat{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.ccat i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff}
.ccat i svg{width:11px;height:11px}
.cname{font-size:22px;font-weight:700;line-height:1.2;margin:4px 0 2px;letter-spacing:-.01em;text-wrap:balance}
.calt{margin:0;color:var(--ink-2);font-size:13.5px}
.person{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--panel-2)}
.person img{width:72px;height:90px;object-fit:cover;object-position:50% 20%;border-radius:10px;display:block}
.person b{display:block;font-size:15px;line-height:1.3}
.person span{display:block;color:var(--ink-2);font-size:12.5px}
.person small{display:block;color:var(--ink-3);font-size:11px;margin-top:5px;line-height:1.35}
.person small a{color:inherit}
.person.noimg{grid-template-columns:1fr}
.primary{display:flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:12px 16px;border-radius:12px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600;border:none;cursor:pointer;font-size:15px}
.primary svg,.sec svg{width:18px;height:18px;flex:none}
.secs{display:flex;flex-wrap:wrap;gap:8px}
.sec{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:8px 13px;border-radius:12px;background:var(--panel-2);color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:500;border:none;cursor:pointer}
.sec:hover{color:var(--accent)}
.sec[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.sec:disabled{opacity:.45;cursor:default}
.ctext{margin:0;font-size:14.5px;line-height:1.6}
.olds{margin:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:4px}
.olds dt{font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.olds dd{margin:0;display:flex;gap:10px}
.olds dd span{color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:78px}
.meta{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:10px}
.meta a{color:var(--ink-2)}
.voice{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--panel-2)}
.voice .vrow{display:flex;gap:8px;flex-wrap:wrap}
.voice small{color:var(--ink-2);font-size:12.5px}
.rnav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--accent-soft);font-size:13px;font-weight:600;color:var(--accent)}
.rnav div{display:flex;gap:6px}
.rnav button{min-height:38px;min-width:42px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;font-weight:600;cursor:pointer;padding:4px 10px}
.rnav button:disabled{opacity:.35}

/* walk screen */
.walk{padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px}
.wh{font-size:19px;font-weight:700;margin:6px 0 0}
.opt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:12px;border-radius:14px;border:1.5px solid var(--line);cursor:pointer;background:var(--panel);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-size:14px}
.opt span{display:block;font-size:12.5px;color:var(--ink-2)}
.opt i{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-3);margin-top:1px}
.opt[aria-pressed="true"] i{border:6px solid var(--accent)}
.dest{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:14px;background:var(--panel-2)}
.dest small{font-size:12px;color:var(--ink-2)}
.dest b{font-size:17px;line-height:1.25}
.stats{display:flex;gap:16px;margin-top:6px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats strong{font-size:20px;font-weight:700}
.stats span{font-size:11.5px;color:var(--ink-2)}
.status{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start}
.status i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--ink-3)}
.status.ok i{background:var(--accent)}
.status.warn i{background:#D9822B}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:var(--panel-2);font-size:14px;min-height:48px}
.switch input{width:42px;height:24px;accent-color:var(--accent)}
.danger{color:#C93A3A}

/* map */
.mapwrap{grid-column:2;grid-row:1/3;position:relative;overflow:hidden;background:var(--land);touch-action:none;cursor:grab;min-width:0;min-height:0}
.mapwrap.drag{cursor:grabbing}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.m-water{fill:var(--water)} .m-park{fill:var(--park)}
.m-river{fill:none;stroke:var(--water);stroke-width:calc(5px * var(--zw,1));vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.m-stream{fill:none;stroke:var(--water);stroke-width:2px;vector-effect:non-scaling-stroke}
.m-rail{fill:none;stroke:var(--rail);stroke-width:2.4px;vector-effect:non-scaling-stroke}
.m-rail2{fill:none;stroke:var(--land);stroke-width:1.1px;stroke-dasharray:5 5;vector-effect:non-scaling-stroke}
.m-res-c,.m-ter-c,.m-sec-c,.m-pri-c,.m-res,.m-ter,.m-sec,.m-pri{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.m-res-c{stroke:var(--case);stroke-width:calc(2.6px * var(--zw,1))} .m-res{stroke:var(--road);stroke-width:calc(1.6px * var(--zw,1))}
.m-ter-c{stroke:var(--case);stroke-width:calc(4.4px * var(--zw,1))} .m-ter{stroke:var(--road);stroke-width:calc(3.2px * var(--zw,1))}
.m-sec-c{stroke:var(--case);stroke-width:calc(6px * var(--zw,1))} .m-sec{stroke:var(--road);stroke-width:calc(4.6px * var(--zw,1))}
.m-pri-c{stroke:var(--main-case);stroke-width:calc(8px * var(--zw,1))} .m-pri{stroke:var(--main);stroke-width:calc(6.4px * var(--zw,1))}
.sthi{fill:none;stroke:var(--accent);stroke-opacity:.55;stroke-width:calc(9px * var(--zw,1));vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.sthi.hov{stroke-opacity:.3}
.slbl text{font-family:var(--f);fill:var(--label);paint-order:stroke fill;stroke:#fff;stroke-linejoin:round;pointer-events:none;font-weight:500}
#slbl{filter:drop-shadow(0 1px .6px rgba(30,35,40,.16))}
.slbl text.sel{fill:var(--accent);font-weight:700}
.slbl .hph{pointer-events:none}
.ol{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none;display:none}
.ol.show{display:inline}
.mk{cursor:pointer;outline:none}
.mk .hit{fill:transparent}
.mk .pin{stroke:#fff;stroke-width:2}
.mk .ring{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.mk.hl .ring,.mk.on .ring{opacity:1}
.mk .icon{fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.mk .ptxt{font-family:var(--f);font-size:11.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none;display:none}
.mk .ptxt.show{display:inline}
.mk .num{display:none}
.mk.inroute .num{display:inline}
.mk .num circle{fill:var(--accent);stroke:#fff;stroke-width:1.5}
.mk .num text{font-family:var(--f);font-size:9.5px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
.mk.gone,.mk.clustered{display:none}
.cl{cursor:pointer}
.cl circle{fill:var(--panel);stroke:var(--ink-2);stroke-width:1.5}
.cl text{font-family:var(--f);font-size:12px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.c-mon{fill:var(--c-mon)} .c-mem{fill:var(--c-mem)} .c-rel{fill:var(--c-rel)} .c-mus{fill:var(--c-mus)}
.bg-mon{background:var(--c-mon)} .bg-mem{background:var(--c-mem)} .bg-rel{background:var(--c-rel)} .bg-mus{background:var(--c-mus)}
.me .acc{fill:rgba(33,118,255,.14);stroke:rgba(33,118,255,.45);stroke-width:1px;vector-effect:non-scaling-stroke}
.me .dot{fill:#2176FF;stroke:#fff;stroke-width:3}
.ctrl{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:5}
.ctrl .grp{display:flex;flex-direction:column;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.ctrl button{width:44px;height:44px;border:none;background:var(--panel);font-size:21px;line-height:1;cursor:pointer;display:grid;place-items:center}
.ctrl .grp button+button{border-top:1px solid var(--line)}
.ctrl .solo{border-radius:12px;box-shadow:var(--shadow)}
.ctrl button svg{width:20px;height:20px}
.ctrl button.on{color:#2176FF}
.attrib{position:absolute;right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:10.5px;color:var(--ink-2);background:color-mix(in srgb,var(--panel) 75%,transparent);padding:1px 6px;border-radius:4px;z-index:4}
.attrib a{color:inherit}
.pv{position:absolute;left:0;top:0;width:220px;background:rgba(255,252,244,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;pointer-events:none;z-index:6}
.pv[hidden]{display:none}
.pv img{display:block;width:100%;height:140px;object-fit:cover;object-position:50% 22%}
.pv .pvgen{position:relative;height:190px}.pv .pvgen img{position:absolute;inset:0;width:100%;height:100%}.pv .pvgen img+img{object-fit:contain;object-position:50% 100%;padding-top:6px}
.pv .tx{padding:9px 12px 11px}
.pv b{display:block;font-size:14px;line-height:1.3}
.pv span{display:block;font-size:12px;color:var(--ink-2)}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;z-index:8;max-width:calc(100% - 100px);font-size:13.5px}
.toast[hidden]{display:none}
.toast button{flex:none}
.pickhint{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:999px;font-size:13px;z-index:7;pointer-events:none}
.pickhint[hidden]{display:none}

/* collapsible panel */
.tools{display:flex;align-items:center;gap:8px}
.brand b{min-width:0}.brand b span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidep{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:none;background:var(--panel-2);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:36px}
.hidep svg{width:16px;height:16px}
.hidep:hover{color:var(--ink)}
.srow{display:flex;gap:8px;align-items:center}
.listbtn{display:none;align-items:center;gap:7px;border:none;background:var(--panel);box-shadow:var(--shadow);border-radius:12px;padding:0 14px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;flex:none}
.listbtn svg{width:18px;height:18px}
.app.nopanel{grid-template-columns:0 minmax(0,1fr)}
.app.nopanel .side{display:none}

const STORIES={"Әбілқайыр Хан даңғылы": {"who": ["Әбілқайыр хан", "Абулхаир-хан"], "dates": "1693–1748", "ph": "abulkhair-avenue-photo", "bio": ["Кіші жүздің ханы, қолбасшы, жоңғарларға қарсы күрестің басшыларының бірі. 1731 жылы Ресей империясының қол астына кірді.", "Хан Младшего жуза и полководец, один из руководителей борьбы с джунгарами. В 1731 году принял российское подданство."], "note": ["Қаланың орталық даңғылы. 1967 жылғы 16 маусымдағы шешіммен Жеңіс даңғылының бір бөлігі Ленин даңғылы болып аталды, ал 1997 жылғы 23 қазанда Әбілқайыр хан есімі берілді.", "Центральный проспект города. Решением от 16 июня 1967 года часть проспекта Победы стала Ленинским проспектом, а 23 октября 1997 года проспекту дали имя Абулхаир-хана."], "renamed": "1997", "src": [["Википедия: Проспект Абилкайыр-хана", "https://ru.wikipedia.org/wiki/Проспект_Абилкайыр-хана"], ["Википедия: Абулхайр-хан", "https://ru.wikipedia.org/wiki/Абулхайр-хан"], ["Википедия: Переименованные улицы Актобе", "https://ru.wikipedia.org/wiki/Переименованные_улицы_Актобе"]]}, "Сәңкібай Батыр даңғылы": {"who": ["Сәңкібай батыр", "Санкибай-батыр"], "dates": "XVIII ғ. / XVIII в.", "bio": ["XVIII ғасырдағы Кіші жүздің батыры, жоңғар соғыстарына қатысқан.", "Батыр Младшего жуза XVIII века, участник войн с джунгарами."], "note": ["1997 жылға дейін бұл даңғыл Әбілқайыр ханның атымен аталған. Хан есімі қаланың орталық даңғылына берілгенде, бұл даңғыл Сәңкібай батыр атын алды.", "До 1997 года этот проспект носил имя Абулхаир-хана. Когда имя хана передали центральному проспекту, этот проспект назвали в честь Санкибай-батыра."], "oldExtra": [{"p": "–1997", "kk": "Әбілқайыр хан даңғылы", "ru": "проспект Абулхаир-хана"}, {"p": "", "kk": "Еңбек даңғылы", "ru": "проспект Труда"}], "src": [["Википедия: Проспект Абилкайыр-хана (раздел «Название»)", "https://ru.wikipedia.org/wiki/Проспект_Абилкайыр-хана"], ["Википедия: Переименованные улицы Актобе", "https://ru.wikipedia.org/wiki/Переименованные_улицы_Актобе"]]}, "Әлия Молдағұлова даңғылы": {"who": ["Әлия Молдағұлова", "Алия Молдагулова"], "dates": "1925–1944", "por": "aliya-portrait", "bio": ["Мерген, Кеңес Одағының Батыры (қаза тапқаннан кейін). Ақтөбе облысында туып, 1944 жылы Новосокольники маңындағы шайқаста қаза тапты.", "Снайпер, Герой Советского Союза посмертно. Родилась в Актюбинской области, погибла в бою под Новосокольниками в 1944 году."], "src": [["Википедия: Молдагулова, Алия Нурмухамбетовна", "https://ru.wikipedia.org/wiki/Молдагулова,_Алия_Нурмухамбетовна"], ["Википедия: Проспект Алии Молдагуловой", "https://ru.wikipedia.org/wiki/Проспект_Алии_Молдагуловой"]]}, "Әйтеке Би көшесі": {"who": ["Әйтеке би", "Айтеке би"], "dates": "", "bio": ["Төле би мен Қазыбек бимен қатар қазақ халқының үш ұлы биінің бірі, «Жеті жарғы» заңдар жинағын жасауға қатысқан.", "Один из трёх великих биев казахского народа вместе с Төле би и Қазыбек би, участвовал в составлении свода законов «Жеті жарғы»."], "src": [["Википедия: Айтеке-би", "https://ru.wikipedia.org/wiki/Айтеке-би"], ["Википедия: Переименованные улицы Актобе", "https://ru.wikipedia.org/wiki/Переименованные_улицы_Актобе"]]}, "Шоқан Уәлиханов көшесі": {"who": ["Шоқан Уәлиханов", "Чокан Валиханов"], "dates": "1835–1865", "por": "valikhanov-portrait", "bio": ["Ғалым, шығыстанушы, этнограф және саяхатшы. Қашқарияға барып, Орталық Азия халықтарының тарихы мен мәдениеті туралы еңбектер жазды.", "Учёный-востоковед, этнограф и путешественник. Побывал в Кашгарии и написал труды по истории и культуре народов Центральной Азии."], "src": [["Википедия: Валиханов, Чокан Чингисович", "https://ru.wikipedia.org/wiki/Валиханов,_Чокан_Чингисович"], ["Википедия: Переименованные улицы Актобе", "https://ru.wikipedia.org/wiki/Переименованные_улицы_Актобе"]]}, "Тахауи Ахтанов көшесі": {"who": ["Тахауи Ахтанов", "Тахави Ахтанов"], "dates": "1923–1994", "bio": ["Ақтөбе облысында туған жазушы әрі драматург. Облыстық драма театры оның есімімен аталады.", "Писатель и драматург, уроженец Актюбинской области. Его  "short":["Әбілқайыр (1693–1748) — Кіші жүздің ханы және қолбасшы. Ол жоңғар шапқыншылығына қарсы күресте қазақ жасақтарын басқарғандардың бірі болды. 1731 жылы Ресей империясының қол астына кіру туралы шешім қабылдады. Ақтөбе тұрған өңір — Кіші жүздің тарихи жері, сондықтан хан есімі қалада ескерткішпен және орталық даңғылдың атауымен құрметтеледі.","Абулхаир (1693–1748) — хан Младшего жуза и полководец. Он был одним из тех, кто возглавлял казахские войска в борьбе с джунгарским нашествием. В 1731 году принял решение о российском подданстве. Земли, на которых стоит Актобе, — историческая территория Младшего жуза, поэтому имя хана увековечено в городе памятником и названием центрального проспекта."],
 "bio":[["1693 — дүниеге келді.","1693 — родился."],["Жоңғарларға қарсы соғыстарда қазақ қолын бастаушылардың бірі, Аңырақай шайқасына қатысты.","Один из военачальников в войнах с джунгарами, участник Аныракайской битвы."],["1731 — Ресей империясының қол астына кіру туралы ант берді.","1731 — принёс присягу о российском подданстве."],["1748 — Барақ сұлтанмен қақтығыста қаза тапты.","1748 — погиб в столкновении с султаном Бараком."],["1997 — Ақтөбенің орталық даңғылына оның есімі берілді.","1997 — его имя присвоено центральному проспекту Актобе."]]},
"Жалаңтөс баһадүр ескерткіші":{"wiki":"https://ru.wikipedia.org/wiki/Ялангтуш_Бахадур",
 "short":["Жалаңтөс Сейітқұлұлы (шамамен 1576–1656) — Әлімұлы руынан шыққан батыр және қолбасшы. Ол Бұхар хандығының қызметінде Самарқандты басқарды. Оның бұйрығымен Регистан алаңында Шердор және Тілла-Қари медреселері салынды. Әлімұлы рулары Ақтөбе өңірінде мекендеген, сондықтан батырдың есімі осы өлкеде ерекше құрметтеледі.","Жалантос Сейткулулы (около 1576–1656) — батыр и полководец из рода Алимулы. На службе у Бухарского ханства он правил Самаркандом. По его приказу на площади Регистан построены медресе Шердор и Тилля-Кари. Роды Алимулы жили в Актюбинском крае, поэтому имя батыра здесь особенно почитают."],
 "bio":[["Шамамен 1576 — дүниеге келді.","Около 1576 — родился."],["Бұхар хандығының қолбасшысы, Самарқанд әкімі болды.","Военачальник Бухарского ханства, правитель Самарканда."],["1619–1636 — Шердор медресесі салынды.","1619–1636 — построено медресе Шердор."],["1646–1660 — Тілла-Қари медресесі салынды.","1646–1660 — построено медресе Тилля-Кари."],["1656 — қайтыс болды.","1656 — умер."]]},
"Әйтеке би ескерткіші":{"street":"Әйтеке Би көшесі","wiki":"https://ru.wikipedia.org/wiki/Айтеке-би",
 "short":["Әйтеке би Байбекұлы — Төле би мен Қазыбек бимен қатар қазақтың үш ұлы биінің бірі, Кіші жүздің биі. Ол Тәуке хан тұсында «Жеті жарғы» заңдар жинағын жасауға қатысты. Ақтөбеде оған ескерткіш қойылған, ал қаланың ескі бөлігіндегі бұрынғы Ленин көшесі 1998 жылы Әйтеке би есімін алды.","Айтеке би Байбекулы — один из трёх великих биев казахов вместе с Төле би и Қазыбек би, бий Младшего жуза. При хане Тауке он участвовал в создании свода законов «Жеті жарғы». В Актобе ему установлен памятник, а бывшая улица Ленина в старой части города с 1998 года носит его имя."],
 "bio":[["Кіші жүздің биі, дау-дамайды шешкен шешен.","Бий Младшего жуза, оратор и судья."],["Тәуке хан тұсында «Жеті жарғы» заңдарын жасауға қатысты.","При хане Тауке участвовал в составлении законов «Жеті жарғы»."],["Ақтөбеде ескерткіш қойылып, көшеге есімі берілді.","В Актобе установлен памятник, его имя носит улица."]]},
"Мөңке би ескерткіші":{"street":"Мөңке Би көшесі","wiki":"https://ru.wikipedia.org/wiki/Монке_би",
 "short":["Мөңке би Тілеуұлы (1675–1756) — Кіші жүздің Жетіру бірлестігіне кіретін Табын руынан шыққан би, шешен және жырау. Ол халық арасында болашақ туралы толғауларымен танымал. Ақтөбеде оған ескерткіш қойылған, ал бұрынғы Шмидт көшесі Мөңке би есімін алды.","Монке би Тлеуулы (1675–1756) — бий, оратор и жырау из рода Табын объединения Жетыру Младшего жуза. Он известен толғау, в которых говорил о будущем. В Актобе ему установлен памятник, а бывшая улица Шмидта названа его именем."],
 "bio":[["1675 — дүниеге келді.","1675 — родился."],["Табын руының биі, шешен әрі жырау.","Бий рода Табын, оратор и жырау."],["Болашақ туралы толғаулары ұрпақтан ұрпаққа жетті.","Его толғау о будущем передаются из поколения в поколение."],["1756 — қайтыс болды.","1756 — умер."]]},
"Тілеу батыр ескерткіші":{"street":"Тілеу Батыр көшесі",
 "short":["Тілеу батыр — қазақ жерін қорғаған батырлардың бірі. Ақтөбеде оған ескерткіш қойылған, ал бұрынғы Селиверстов көшесіне батыр есімі берілген. Батырдың өмірбаяны туралы тексерілген толық деректер бұл картаға әлі қосылмаған.","Тлеу-батыр — один из батыров, защищавших казахские земли. В Актобе ему установлен памятник, а бывшая улица Селиверстова названа его именем. Проверенная подробная биография батыра в эту карту пока не добавлена."]},
"Сәңкібай батыр ескерткіші":{"street":"Сәңкібай Батыр даңғылы",
 "short":["Сәңкібай батыр — XVIII ғасырда өмір сүрген Кіші жүздің батыры, жоңғарларға қарсы соғыстардың қатысушысы. Ақтөбеде оның есімімен сквер, ескерткіш және даңғыл аталған. Даңғыл 1997 жылы Әбілқайыр хан даңғылының орнына осы атауды алды.","Санкибай-батыр — батыр Младшего жуза XVIII века, участник войн с джунгарами. В Актобе его имя носят сквер, памятник и проспект. Проспект получил это название в 1997 году, сменив имя Абулхаир-хана."]},
"Бөгенбай батыр ескерткіші":{"wiki":"https://ru.wikipedia.org/wiki/Богенбай-батыр",
 "short":["Бөгенбай батыр (1690–1778) — Орта жүздің Қанжығалы руынан шыққан қолбасшы, Абылай ханның серігі. Ол жоңғарларға қарсы көптеген жорықтарды басқарды. Ақтөбеде оған қаланың оңтүстік бөлігінде ескерткіш қойылған — бұл жоңғар соғыстарындағы бүкіл қазақ халқының бірлігін еске салады.","Богенбай-батыр (1690–1778) — полководец из рода Канжыгалы Среднего жуза, соратник Абылай-хана. Он руководил многими походами против джунгар. В Актобе ему установлен памятник в южной части города — напоминание о единстве всего казахского народа в войнах с джунгарами."],
 "bio":[["1690 — дүниеге келді.","1690 — родился."],["Жоңғарларға қарсы жорықтарды басқарған қолбасшы.","Руководил походами против джунгар."],["Абылай ханның серігі.","Соратник Абылай-хана."],["1778 — қайтыс болды.","1778 — умер."]]},
"Есет Көтібарұлы ескерткіші":{"wiki":"https://ru.wikipedia.org/wiki/Есет_Котибаров",
 "short":["Есет Көтібарұлы (1807–1889) — Кіші жүздің Шекті руынан шыққан батыр. Ол 1847–1858 жылдардағы көтерілісті басқарып, Хиуа мен Қоқан хандықтарына және патшалық Ресейдің отарлық саясатына қарсы күресті. Шекті руы Ақтөбе өңірінде мекендеген, сондықтан батыр осы өлкенің тарихымен тығыз байланысты. Оның XIX ғасырдағы фотосуреті сақталған.","Есет Котибарулы (1807–1889) — батыр из рода Шекты Младшего жуза. Он возглавил восстание 1847–1858 годов и боролся против Хивинского и Кокандского ханств и колониальной политики царской России. Род Шекты жил в Актюбинском крае, поэтому батыр тесно связан с историей этих мест. Сохранилась его фотография XIX века."],
 "bio":[["1807 — дүниеге келді.","1807 — родился."],["1847–1858 — көтерілісті басқарды.","1847–1858 — руководил восстанием."],["Хиуа, Қоқан және патшалық отаршылдыққа қарсы күресті.","Боролся против Хивы, Коканда и царской колониальной политики."],["1889 — қайтыс болды.","1889 — умер."]]},
"Ер Едіге ескерткіші":{"street":"Едіге Батыр даңғылы","wiki":"https://ru.wikipedia.org/wiki/Едигей",
 "short":["Едіге (1352–1419) — Алтын Орданың әмірі және Ноғай Ордасының негізін қалаушы. Ол туралы «Ер Едіге» батырлық жыры қазақ, ноғай және басқа түркі халықтарында сақталған. Ақтөбеде оған ескерткіш қойылған, қаланың ірі даңғылдарының бірі оның есімімен аталады.","Едиге (1352–1419) — эмир Золотой Орды и основатель Ногайской Орды. Героический эпос «Ер Едіге» о нём сохранился у казахов, ногайцев и других тюркских народов. В Актобе ему установлен памятник, его имя носит один из крупных проспектов города."],
 "bio":[["1352 — дүниеге келді.","1352 — родился."],["Алтын Орданың әмірі.","Эмир Золотой Орды."],["Ноғай Ордасының негізін қалады.","Основал Ногайскую Орду."],["1419 — қайтыс болды.","1419 — умер."]]},
"Ахмет Жұбанов атындағы мемориалдық кешен":{"street":"Ағайынды Жұбановтар көшесі","wiki":"https://ru.wikipedia.org/wiki/Жубанов,_Ахмет_Куанович",
 "short":["Ахмет Жұбанов (1906–1968) — Ақтөбе өңірінен шыққан композитор, музыкатанушы және академик. Ол 1934 жылы қазақ халық аспаптар оркестрін құрды, кейін оркестрге Құрманғазы есімі берілді. Латиф Хамидимен бірге «Абай» операсын жазды. Ақтөбеде оның есімімен мемориалдық кешен бар, ал бұрынғы Энгельс көшесі ағайынды Жұбановтар есімін алды.","Ахмет Жубанов (1906–1968) — композитор, музыковед и академик, уроженец Актюбинского края. В 1934 году он создал казахский оркестр народных инструментов, которому позже присвоили имя Курмангазы. Вместе с Латифом Хамиди написал оперу «Абай». В Актобе есть мемориальный комплекс его имени, а бывшая улица Энгельса названа в честь братьев Жубановых."],
 "bio":[["1906 — Ақтөбе өңірінде дүниеге келді.","1906 — родился в Актюбинском крае."],["1934 — халық аспаптар оркестрін құрды (кейін Құрманғазы атындағы).","1934 — создал оркестр народных инструментов (позже имени Курмангазы)."],["Латиф Хамидимен бірге «Абай» операсын жазды.","Вместе с Латифом Хамиди написал оперу «Абай»."],["1968 — қайтыс болды.","1968 — умер."]]},
"Әлия Молдағұлова атындағы мемориалдық кешен":{"street":"Әлия Молдағұлова даңғылы","wiki":"https://ru.wikipedia.org/wiki/Молдагулова,_Алия_Нурмухамбетовна",
 "short":["Әлия Молдағұлова (1925–1944) — мерген, Кеңес Одағының Батыры (қаза тапқаннан кейін). Ол Ақтөбе облысында туып, Ленинградта тәрбиеленді. Мергендер мектебін бітіріп, майданда соғысты және 1944 жылы Новосокольники маңында қаза тапты. Ақтөбеде оның атымен мемориалдық кешен, мұражай және қаланың басты даңғылдарының бірі аталған.","Алия Молдагулова (1925–1944) — снайпер, Герой Советского Союза посмертно. Она родилась в Актюбинской области и выросла в Ленинграде. Окончила снайперскую школу, воевала на фронте и погибла в 1944 году под Новосокольниками. В Актобе её имя носят мемориальный комплекс, музей и один из главных проспектов города."],
 "bio":[["1925 — Ақтөбе облысында дүниеге келді.","1925 — родилась в Актюбинской области."],["Ленинградта тәрбиеленді.","Выросла в Ленинграде."],["1943 — Орталық әйелдер мергендер мектебін бітірді.","1943 — окончила Центральную женскую школу снайперской подготовки."],["14 қаңтар 1944 — Новосокольники маңында қаза тапты.","14 января 1944 — погибла под Новосокольниками."],["1944 — Кеңес Одағының Батыры атағы берілді.","1944 — посмертно присвоено звание Героя Советского Союза."]]},
"В. Пацаев ескерткіші":{"street":"Пацаев көшесі","wiki":"https://ru.wikipedia.org/wiki/Пацаев,_Виктор_Иванович",
 "short":["Виктор Пацаев (1933–1971) — Ақтөбеде туған ғарышкер және инженер. 1971 жылы ол «Союз-11» экипажының құрамында алғашқы «Салют-1» орбиталық станциясында жұмыс істеді. Жерге оралу кезінде кеменің герметикасы бұзылып, экипаж қаза тапты. Туған қаласында оған ескерткіш қойылып, көшеге есімі берілген.","Виктор Пацаев (1933–1971) — космонавт и инженер, уроженец Актобе. В 1971 году в экипаже «Союза-11» он работал на первой орбитальной станции «Салют-1». При возвращении на Землю корабль разгерметизировался, и экипаж погиб. В родном городе ему установлен памятник, его имя носит улица."],
 "bio":[["1933 — Ақтөбеде дүниеге келді.","1933 — родился в Актюбинске."],["Ғарыш техникасы бойынша инженер болып жұмыс істеді.","Работал инженером в космической отрасли."],["1971, маусым — «Союз-11» экипажымен «Салют-1» станциясында жұмыс істеді.","Июнь 1971 — работал на станции «Салют-1» в экипаже «Союза-11»."],["30 маусым 1971 — Жерге оралу кезінде қаза тапты.","30 июня 1971 — погиб при возвращении на Землю."]]},
"Абай Құнанбайұлы ескерткіші":{"street":"Абай даңғылы","wiki":"https://ru.wikipedia.org/wiki/Абай_Кунанбаев",
 "short":["Абай Құнанбайұлы (1845–1904) — ақын, ойшыл, композитор және аудармашы, қазақ жазба әдебиетінің негізін салушы. «Қара сөздер» — оның адамгершілік пен білім туралы толғаулары. Ол Пушкин, Лермонтов және Крыловтың шығармаларын қазақ тіліне аударды. Ақтөбеде Абайға ескерткіш қойылған, бұрынғы Октябрь бульвары Абай даңғылы деп аталды.","Абай Кунанбаев (1845–1904) — поэт, мыслитель, композитор и переводчик, основоположник казахской письменной литературы. «Слова назидания» — его размышления о нравственности и знании. Он перевёл на казахский язык произведения Пушкина, Лермонтова и Крылова. В Актобе Абаю установлен памятник, а бывший Октябрьский бульвар стал проспектом Абая."],

const app=document.querySelector(".app");
function keepCenter(change){const c=toWorld(...centerPx());change();requestAnimationFrame(()=>{const [rx,ry]=wrapToRoot(...centerPx());tx=rx-c[0]*k;ty=ry-c[1]*k;clamp();apply(true)})}
function setPanel(open,quiet){const f=()=>{panelOpen=open;app.classList.toggle("nopanel",!open);try{localStorage.setItem("panel",open?"1":"0")}catch(e){}};quiet?f():keepCenter(f);updListBtn();if(!open&&document.activeElement&&side.contains(document.activeElement))$("listbtn").focus()}

function rowPlace(p){return `<li><button type="button" class="row${sel&&sel.t==="p"&&sel.i===p.i?" on":""}" data-t="p" data-i="${p.i}"><span class="ic bg-${p.c}">${svgI(p.c)}</span><span><b>${esc(NAME(p))}</b><span>${esc(CAP(p)||CAT1[p.c][li()])}</span></span>${p.tour?'<span class="tag3d">3D</span>':""}</button></li>`}
function rowStreet(s){const st=s.story,im=st&&(st.por||st.ph);return `<li><button type="button" class="row" data-t="s" data-i="${s.i}"><span class="ic st">${im?`<img src="${imgUrl(im)}" alt="">`:svgI("st")}</span><span><b>${esc(SN(s))}</b><span>${esc(st?st.who[li()]+(st.dates?" · "+st.dates:""):SA(s))}</span></span>${st?`<span class="hp">${UI.hp}</span>`:""}</button></li>`}
function bindRows(){pane.querySelectorAll(".row").forEach(b=>{const t=b.dataset.t,i=+b.dataset.i;
  b.onclick=()=>t==="p"?openPlace(i,{from:b,zoom:true}):openStreet(i,{from:b});
  b.onmouseenter=()=>hover({t,i},true);b.onmouseleave=()=>hover(null);b.onfocus=()=>hover({t,i},true);b.onblur=()=>hover(null)})}
function renderHome(){
  view="home";
  const places=P.filter(p=>active.has(p.c));
  P.forEach(p=>p.el.classList.toggle("gone",!active.has(p.c)&&!(sel&&sel.t==="p"&&sel.i===p.i)));
  const storyStreets=STREETS.filter(s=>s.story).sort((a,b)=>SN(a).localeCompare(SN(b),L));
  pane.innerHTML=`<div class="phead"><button class="x" type="button" id="sheetx" aria-label="${T("close")}">×</button></div><div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="places" aria-selected="${tab==="places"}">${T("places")} · ${places.length}</button><button class="tab" role="tab" data-tab="streets" aria-selected="${tab==="streets"}">${T("streets")} · ${storyStreets.length}</button><svg class="orn-mini orn-tabs" aria-hidden="true" focusable="false"><use href="#kosh"/></svg><button class="x sheetx" type="button" id="sheetx2" aria-label="${T("close")}">×</button></div>
   <button class="walkbtn" id="walkbtn" type="button">${UI.walk}<span><b>${T("walk")}</b><span>${T("walkSub")}</span></span></button>
   ${tab==="places"?`<div class="chips">${Object.keys(CATS).map(c=>`<button class="chip" type="button" data-cat="${c}" aria-pressed="${active.has(c)}"><i class="bg-${c}">${svgI(c)}</i>${CATS[c][li()]} <small>${P.filter(p=>p.c===c).length}</small></button>`).join("")}</div>
     <div class="route"><b>${T("route")}</b><p>${T("routeSub")}</p><ol class="stops">${route.map((i,n)=>`<li><button type="button" data-stop="${n}"><i>${n+1}</i>${esc(SHORT(P[i]))}</button></li>`).join("")}</ol></div>
     <ul class="list">${places.map(rowPlace).join("")}</ul>
     <p class="h3">${T("tours")}</p><div class="tours">${Object.values(TOURS).map(t=>`<a class="tcard" href="${t.u}" target="_blank" rel="noopener"><em>3D · 360°</em><b>${esc(L==="kk"?t.t:t.tr)}</b></a>`).join("")}</div>`
   :`<p class="h3">${T("storyStreets")}</p><ul class="list">${storyStreets.map(rowStreet).join("")}</ul><p class="empty">${T("anyStreet")}</p>`}
   <p class="note">${T("noteHtml")}</p>`;
  pane.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderHome()});
  pane.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const c=b.dataset.cat;active.has(c)?active.delete(c):active.add(c);renderHome();scheduleLabels(0)});
  pane.querySelectorAll("[data-stop]").forEach(b=>b.onclick=()=>{rIdx=+b.dataset.stop;openPlace(route[rIdx],{from:b,zoom:true,keepRoute:true})});
  $("walkbtn").onclick=openWalk;const sx=$("sheetx2");if(sx)sx.onclick=()=>setSheet("hidden");
  bindRows();
}

function showChip(s){chipst.innerHTML=`<div><b>${esc(SN(s))}</b><span>${esc(SA(s))}</span></div><button class="x" type="button" aria-label="${T("close")}">×</button>`;chipst.hidden=false;chipst.querySelector(".x").onclick=()=>{hideChip();sel=null;$("stSel").style.display="none";scheduleLabels(0)}}
function hideChip(){chipst.hidden=true}
function onPlaceTap(i,from){if(walk.on&&walk.mode==="dest"&&!walk.started){walk.dest=i;renderWalk();return}openPlace(i,{from})}
function openPlace(i,opt={}){const p=P[i];if(!opt.keepRoute)rIdx=-1;sel={t:"p",i};
  P.forEach(o=>o.el.classList.toggle("on",o.i===i));mg.appendChild(p.el);p.el.classList.remove("gone");
  p.el.classList.remove("pulse");void p.el.getBBox();p.el.classList.add("pulse");
  const ol=$("olSel");if(p.out){ol.setAttribute("d",p.out);ol.classList.add("show")}else ol.classList.remove("show");
  $("stSel").style.display="none";openWin("p",i,opt)}
function openStreet(i,opt={}){const s=STREETS[i];sel={t:"s",i};
  P.forEach(o=>o.el.classList.remove("on"));$("olSel").classList.remove("show");
  const hi=$("stSel");hi.setAttribute("d",s.d);hi.style.display="";$("stHov").style.display="none";pv.hidden=true;
  if(s.story){openWin("s",i,opt);return}
  if(win.open){win.open=false;hw.hidden=true;win.saved=null}
  showChip(s);if(opt.fit)fitBox(...s.bb,6);scheduleLabels(0)}
function closeCard(){if(win.open)closeWin();else{hideChip();sel=null;$("stSel").style.display="none";scheduleLabels(0)}}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!lb.hidden){closeLightbox();return}if(!$("results").hidden){hideResults();return}if(win.open){closeWin();return}if(!chipst.hidden){closeCard();return}hover(null)}});

/* ---------- search ---------- */
const q=$("q"),results=$("results");let kb=-1,resList=[];
q.addEventListener("input",()=>{$("qx").hidden=!q.value;runSearch()});
q.addEventListener("focus",()=>{if(q.value)runSearch()});
q.addEventListener("keydown",e=>{if(results.hidden)return;if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();kb=(kb+(e.key==="ArrowDown"?1:-1)+resList.length)%resList.length;markKb()}else if(e.key==="Enter"){e.preventDefault();pick(resList[Math.max(0,kb)])}});
$("qx").onclick=()=>{q.value="";$("qx").hidden=true;hideResults();q.focus()};
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".sbox"))hideResults()});
function runSearch(){const f=fold(q.value);if(!f){hideResults();return}
  const pl=P.filter(p=>p.key.includes(f)).slice(0,6).map(p=>({t:"p",i:p.i})),st=STREETS.filter(s=>s.key.includes(f)).sort((a,b)=>(!!b.story)-(!!a.story)||b.r-a.r).slice(0,6).map(s=>({t:"s",i:s.i}));
  resList=[...pl,...st];kb=-1;
  const hl=s=>esc(s);
  results.innerHTML=resList.length?resList.map((r,n)=>{if(r.t==="p"){const p=P[r.i];return `<button class="res" type="button" role="option" data-n="${n}"><span class="ic bg-${p.c}">${svgI(p.c)}</span><span><b>${hl(NAME(p))}</b><span>${esc(CAT1[p.c][li()])}</span></span></button>`}
    const s=STREETS[r.i];const old=s.olds.find(o=>fold((o.kk||"")+" "+(o.ru||"")).includes(f));
    return `<button class="res" type="button" role="option" data-n="${n}"><span class="ic" style="background:var(--ink-3)">${svgI("st","#fff")}</span><span><b>${hl(SN(s))}</b><span>${old?esc((L==="kk"?"бұрын: ":"ранее: ")+(old.ru||old.kk)):esc(T("street"))+(s.story?" · "+esc(s.story.who[li()]):"")}</span></span></button>`}).join(""):`<div class="res-empty">${T("empty")}</div>`;
  results.hidden=false;q.setAttribute("aria-expanded","true");
  results.querySelectorAll(".res").forEach(b=>{b.onclick=()=>pick(resList[+b.dataset.n]);const r=resList[+b.dataset.n];b.onmouseenter=()=>hover(r,true);b.onmouseleave=()=>hover(null)});
}
function markKb(){results.querySelectorAll(".res").forEach((b,n)=>b.classList.toggle("kb",n===kb))}
function hideResults(){results.hidden=true;q.setAttribute("aria-expanded","false")}
function pick(r){if(!r)return;hideResults();q.blur();hover(null);if(r.t==="p")openPlace(r.i,{zoom:true,from:q});else openStreet(r.i,{fit:true,from:q})}

/* ---------- voice guide ---------- */
const voice={state:"idle",text:"",lang:"",cur:null,tts:null,muted:false};
let voices=[];const loadVoices=()=>{try{voices=speechSynthesis.getVoices()}catch(e){voices=[]}};
if("speechSynthesis"in window){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(win.open&&win.t==="s")renderVoice(win.i)}}
(async()=>{try{if(window.claude&&claude.use){const t=await claude.use("tts");if(t){voice.tts=t;t.onState(({state})=>{if(voice.engine==="tts"){voice.state=state==="speaking"?"speaking":state==="paused"?"paused":"idle";refreshVoice()}})}}}catch(e){}})();
function pickVoice(lang){return voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang))||null}
function canSpeak(lang){if(pickVoice(lang))return "sys";if(lang==="ru"&&voice.tts)return "tts";return null}
function storyText(i){const s=STREETS[i],st=s.story;if(!st)return"";
  const olds=s.olds.filter(o=>o.p).map(o=>L==="kk"?(o.kk||o.ru):(o.ru||o.kk));
  const oldLine=olds.length?(L==="kk"?" Бұрынғы атаулары: "+olds.join(", ")+".":" Прежние названия: "+olds.join(", ")+"."):"";
  return `${SN(s)}.${oldLine} ${st.event?"":(L==="kk"?"Көше "+st.who[0]+" құрметіне аталған. ":"Улица названа в честь: "+st.who[1]+". ")}${st.bio[li()]}${st.note?" "+st.note[li()]:""}`}
function speak(i){
  stopVoice();if(voice.muted)return;const lang=L==="kk"?"kk":"ru",how=canSpeak(lang);if(!how)return false;
  voice.text=storyText(i);voice.street=i;voice.lang=lang;
  if(how==="sys"){const u=new SpeechSynthesisUtterance(voice.text);const vv=pickVoice(lang);try{u.voice=vv}catch(e){}u.lang=vv.lang||lang;u.rate=1;
    u.onend=u.onerror=()=>{if(voice.cur===u){voice.state="idle";refreshVoice()}};voice.cur=u;voice.engine="sys";speechSynthesis.speak(u);voice.state="speaking"}
  else{voice.engine="tts";voice.state="speaking";voice.tts.speak(voice.text,{language:"ru"}).catch(()=>{voice.state="idle";refreshVoice()})}
  refreshVoice();return true}
function pauseVoice(){if(voice.engine==="sys"){speechSynthesis.pause()}else voice.tts&&voice.tts.pause();voice.state="paused";refreshVoice()}
function resumeVoice(){if(voice.engine==="sys"){speechSynthesis.resume()}else voice.tts&&voice.tts.resume();voice.state="speaking";refreshVoice()}
function stopVoice(){try{speechSynthesis.cancel()}catch(e){}try{voice.tts&&voice.tts.stop()}catch(e){}voice.cur=null;voice.state="idle";refreshVoice()}
function refreshVoice(){if(win.open&&win.t==="s")renderVoice(win.i)}
function renderVoice(i){const el=$("voice");if(!el)return;const lang=L==="kk"?"kk":"ru",how=canSpeak(lang),mine=voice.street===i&&voice.state!=="idle";
  if(!how){el.innerHTML=`<small>${UI.hp} ${L==="kk"?T("noVoiceKk"):T("noVoice")}</small>`;return}
  el.innerHTML=`<div class="vrow">${!mine?`<button class="act act-go" type="button" data-v="play">${UI.hp}${T("listen")}</button>`:
    voice.state==="speaking"?`<button class="act" type="button" data-v="pause">${UI.pause}${T("pause")}</button>`:`<button class="act" type="button" data-v="resume">${UI.play}${T("resume")}</button>`}
    ${mine?`<button class="act" type="button" data-v="replay" aria-label="${T("replay")}">↻</button><button class="act" type="button" data-v="stop" aria-label="${T("stop")}">■</button>`:""}</div>
`;
  el.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(v==="play"||v==="replay"){walk.played.add(i);speak(i)}else if(v==="pause")pauseVoice();else if(v==="resume")resumeVoice();else stopVoice()})}

/* ---------- walk mode ---------- */
const walk={on:false,mode:"route",dest:-1,started:false,stops:[],cur:0,pos:null,acc:null,watch:null,follow:true,picking:false,manual:false,auto:false,played:new Set(),status:"",statusCls:""};
const toast=$("toast"),pickhint=$("pickhint");
function openWalk(){walk.on=true;hideResults();if(win.open)closeWin();if(!isPhone()&&!panelOpen)setPanel(true);if(sel){sel=null;P.forEach(o=>o.el.classList.remove("on"));$("stSel").style.display="none";$("olSel").classList.remove("show")}renderWalk();if(isPhone())setSheet("half")}
function walkStops(){return walk.mode==="route"?route.slice():(walk.dest>=0?[walk.dest]:[])}
function fmtDist(m){return m<1000?`${Math.round(m/10)*10} ${T("m")}`:`${(m/1000).toFixed(1).replace(".",",")} ${T("km")}`}
function distM(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by)/UPM}
function renderWalk(){
  view="walk";const stops=walkStops();
  P.forEach(p=>{p.el.classList.toggle("inroute",walk.started&&stops.includes(p.i));const n=stops.indexOf(p.i);p.el.querySelector(".num text").textContent=n>=0?n+1:""});
  if(!walk.started){
    pane.innerHTML=`<div class="card">${cardBar()}<div class="walk"><h2 class="wh">${T("wTitle")}</h2>
      <button class="opt" type="button" data-m="route" aria-pressed="${walk.mode==="route"}"><i></i><span><b>${T("wRoute")}: ${T("route")}</b><span>${route.map(i=>SHORT(P[i])).join(" → ")}</span></span></button>
      <button class="opt" type="button" data-m="dest" aria-pressed="${walk.mode==="dest"}"><i></i><span><b>${T("wDest")}</b><span>${walk.dest>=0?esc(NAME(P[walk.dest])):T("wDestSub")}</span></span></button>
      ${walk.mode==="dest"?`<ul class="list" style="padding:0;max-height:240px;overflow:auto">${P.map(p=>`<li><button type="button" class="row${walk.dest===p.i?" on":""}" data-d="${p.i}"><span class="ic bg-${p.c}">${svgI(p.c)}</span><span><b>${esc(NAME(p))}</b><span>${esc(CAT1[p.c][li()])}</span></span></button></li>`).join("")}</ul>`:""}
      <label class="switch"><span>${T("wAuto")}</span><input type="checkbox" id="wauto" ${walk.auto?"checked":""}></label>
      <button class="primary" type="button" id="wstart" ${stops.length?"":"disabled"}>${UI.walk}${T("wStart")}</button>
      <p class="calt">${T("noNav")}</p></div></div>`;
    bindBar();
    pane.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{walk.mode=b.dataset.m;renderWalk()});
    pane.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{walk.dest=+b.dataset.d;renderWalk();ensureVisible(P[walk.dest].x,P[walk.dest].y)});
    $("wauto").onchange=e=>{walk.auto=e.target.checked};
    $("wstart").onclick=startWalk;
    return}
  const next=stops[walk.cur],np=next!=null?P[next]:null;
  let dist=null;if(walk.pos&&np)dist=distM(walk.pos.x,walk.pos.y,np.x,np.y);
  const fin=walk.cur>=stops.length;
  pane.innerHTML=`<div class="card">${cardBar()}<div class="walk">
    <div class="status ${walk.statusCls}" id="wstatus"><i></i><span>${esc(walk.status)}</span></div>
    ${fin?`<div class="dest"><b>${T("done")}</b></div>`:`<div class="dest"><small>${walk.mode==="route"?`${T("wNext")} · ${walk.cur+1} / ${stops.length}`:T("wDestL")}</small><b>${esc(NAME(np))}</b>
      <div class="stats"><div><strong>${dist!=null?fmtDist(dist):"—"}</strong><span>${T("wDist")}</span></div><div><strong>${dist!=null?Math.max(1,Math.round(dist*1.25/75))+" "+T("min"):"—"}</strong><span>${T("wTime")}</span></div></div></div>
      <div class="secs"><button class="sec" type="button" id="wme">${T("follow")}</button><button class="sec" type="button" id="wcard">${esc(SHORT(np))} →</button>${walk.mode==="route"?`<button class="sec" type="button" id="wskip" ${walk.cur>=stops.length-1?"disabled":""}>${T("wGo")} →</button>`:""}</div>`}
    <label class="switch"><span>${T("wAuto")}</span><input type="checkbox" id="wauto" ${walk.auto?"checked":""}></label>
    <label class="switch"><span>${T("wMute")}</span><input type="checkbox" id="wmute" ${voice.muted?"checked":""}></label>
    <p class="calt">${T("noNav")}</p>
    <button class="sec danger" type="button" id="wend">${T("wEnd")}</button></div></div>`;
  bindBar();
  $("wauto").onchange=e=>{walk.auto=e.target.checked};
  $("wmute").onchange=e=>{voice.muted=e.target.checked;if(voice.muted)stopVoice()};
  $("wend").onclick=endWalk;
  if(!fin){$("wme").onclick=()=>{walk.follow=true;updateLocBtn();if(walk.pos)centerWorld(walk.pos.x,walk.pos.y,Math.max(k,6))};$("wcard").onclick=()=>openPlace(next,{zoom:true});
    const sk=$("wskip");if(sk)sk.onclick=()=>{walk.cur++;renderWalk();const n=P[walkStops()[walk.cur]];if(n)ensureVisible(n.x,n.y)}}
}
function setStatus(text,cls){walk.status=text;walk.statusCls=cls||"";const el=$("wstatus");if(el){el.className="status "+walk.statusCls;el.querySelector("span").textContent=text}}
function startWalk(){
  walk.started=true;walk.cur=0;walk.played=new Set();walk.stops=walkStops();walk.follow=true;
  setStatus(T("gpsAsk"));renderWalk();
  const st=walk.stops.map(i=>P[i]);fitBox(Math.min(...st.map(p=>p.x))-20,Math.min(...st.map(p=>p.y))-20,Math.max(...st.map(p=>p.x))+20,Math.max(...st.map(p=>p.y))+20,6);
  if(!("geolocation"in navigator)){gpsFail();return}
  try{walk.watch=navigator.geolocation.watchPosition(onGps,gpsFail,{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}catch(e){gpsFail()}
}
function gpsFail(){if(walk.watch!=null){try{navigator.geolocation.clearWatch(walk.watch)}catch(e){}walk.watch=null}
  if(!walk.started)return;walk.manual=true;walk.picking=true;setStatus(T("gpsNo"),"warn");pickhint.textContent=walk.pos?T("pickMove"):T("pick");pickhint.hidden=false}
function onGps(pos){const {latitude:lat,longitude:lon,accuracy}=pos.coords;const [x,y]=proj(lat,lon);
  if(x<-200||y<-200||x>W+200||y>H+200){gpsFail();return}
  walk.manual=false;walk.picking=false;pickhint.hidden=true;updatePos(x,y,accuracy)}
function setManualPos(x,y){updatePos(x,y,8);pickhint.textContent=T("pickMove")}
function updatePos(x,y,acc){walk.pos={x,y};walk.acc=acc;
  setStatus(walk.manual?`${T("chooseStart")}: ${L==="kk"?"қолмен":"вручную"}`:(acc>25?T("gpsLow"):T("gpsOk"))+Math.round(acc)+" "+T("m"),walk.manual?"warn":acc>25?"warn":"ok");
  positionMe();if(walk.follow)ensureVisible(x,y,Math.max(k,6));
  // arrival
  const stops=walk.stops,np=P[stops[walk.cur]];
  if(np&&distM(x,y,np.x,np.y)<Math.max(35,Math.min(acc,60))){showToast(`${T("arrived")} ${SHORT(np)}`,()=>openPlace(np.i,{zoom:true}),SHORT(np));if(walk.cur<stops.length)walk.cur++}
  if(view==="walk")renderWalk();
  checkStreets(x,y,acc);updateLocBtn()}
function positionMe(){const g=$("meG");if(!walk.pos){g.style.display="none";return}g.style.display="";const s=S();
  g.querySelector(".dot").setAttribute("r",(7/s).toFixed(3));g.querySelector(".dot").setAttribute("stroke-width",(3/s).toFixed(3));
  g.querySelector(".acc").setAttribute("r",Math.max(walk.acc*UPM,7/s).toFixed(3));g.setAttribute("transform",`translate(${walk.pos.x} ${walk.pos.y})`)}
function updateLocBtn(){$("loc").classList.toggle("on",!!walk.pos&&walk.follow)}
function checkStreets(x,y,acc){
  const near=[];for(const s of STREETS){if(!s.story)continue;const b=s.bb,tol=60*UPM;if(x<b[0]-tol||x>b[2]+tol||y<b[1]-tol||y>b[3]+tol)continue;
    let d=1e9;for(const c of s.pts)for(let j=1;j<c.length;j++)d=Math.min(d,segDist(x,y,c[j-1],c[j]));near.push({s,d:d/UPM})}
  near.sort((a,b)=>a.d-b.d);const a=near[0];if(!a||a.d>30)return;
  if(walk.played.has(a.s.i))return;
  const ambiguous=near[1]&&near[1].d-a.d<20,lowAcc=acc>25;
  if(walk.auto&&!voice.muted&&!ambiguous&&!lowAcc&&voice.state==="idle"&&canSpeak(L==="kk"?"kk":"ru")){walk.played.add(a.s.i);speak(a.s.i);showToast(`${UI.hp} ${SN(a.s)}`,()=>openStreet(a.s.i,{}),T("pause"),true);return}
  if(voice.state!=="idle")return;
  showToast(`${T("near")} ${SN(a.s)}`,()=>{walk.played.add(a.s.i);openStreet(a.s.i,{})},T("listen"))}
let toastTimer;
function showToast(html,act,label,playing){toast.innerHTML=`<span>${html.startsWith("<svg")?html:esc(html)}</span><button class="sec" type="button" id="tact">${esc(label)}</button><button class="x" type="button" id="tx" aria-label="${T("close")}">×</button>`;toast.hidden=false;
  $("tact").onclick=()=>{toast.hidden=true;if(playing){voice.state==="speaking"?pauseVoice():resumeVoice()}act&&act()};$("tx").onclick=()=>{toast.hidden=true};clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.hidden=true},20000)}
function endWalk(){if(walk.watch!=null){try{navigator.geolocation.clearWatch(walk.watch)}catch(e){}}walk.watch=null;stopVoice();
  Object.assign(walk,{on:false,started:false,pos:null,acc:null,picking:false,manual:false,cur:0});pickhint.hidden=true;toast.hidden=true;positionMe();updateLocBtn();
  P.forEach(p=>p.el.classList.remove("inroute"));sel=null;renderHome();if(isPhone())setSheet("peek");scheduleLabels(0)}

/* ---------- language ---------- */
function setLang(l){L=l;try{localStorage.setItem("lang",l)}catch(e){}document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=T(el.dataset.i));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  q.placeholder=T("ph");q.setAttribute("aria-label",T("ph"));$("zin").setAttribute("aria-label",T("zoomIn"));$("zout").setAttribute("aria-label",T("zoomOut"));$("loc").setAttribute("aria-label",T("me"));$("loc").title=T("me");
  svg.setAttribute("aria-label",T("map"));P.forEach(p=>p.el.setAttribute("aria-label",`${NAME(p)}. ${CAT1[p.c][li()]}`));
  if(voice.state!=="idle")stopVoice();
  if(win.open)renderWin();else if(view==="walk")renderWalk();else renderHome();if(!chipst.hidden&&sel&&sel.t==="s")showChip(STREETS[sel.i]);
  if(!results.hidden)runSearch();measureTop();scheduleLabels(0)}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

/* ---------- start ---------- */
function startView(){const [cx,cy]=proj(50.2905,57.172);const k1=isPhone()?2.3:1.35;const a=freeArea(),[rx,ry]=wrapToRoot((a.l+a.r)/2,(a.t+a.b)/2);k=k1;tx=rx-cx*k;ty=ry-cy*k;clamp()}
if(isPhone())side.dataset.s="hidden";setPanel(panelOpen||isPhone(),true);setLang(L);measureTop();sheetPx();startView();apply(true);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>scheduleLabels(0));
</script>
